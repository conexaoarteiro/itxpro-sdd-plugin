  <text x="980" y="452" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#F0EBE1">PORT&#195;O HUMANO</text>
  <text x="980" y="468" text-anchor="middle" font-size="10" fill="rgba(240,235,225,0.70)">POR EXCE&#199;&#195;O</text>

