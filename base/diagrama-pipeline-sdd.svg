  <line x1="923" y1="400" x2="946" y2="400" stroke="rgba(240,235,225,0.55)" stroke-width="1.5" marker-end="url(#seta)"/>
  <polygon points="980,372 1008,400 980,428 952,400" fill="#0D0D0D" stroke="#F26101" stroke-width="2"/>
