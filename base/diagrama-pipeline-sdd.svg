<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 880" font-family="Archivo, 'Helvetica Neue', Arial, sans-serif">
  <defs>
    <marker id="seta" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto" fill="rgba(240,235,225,0.55)">
      <polygon points="0 0, 8 3, 0 6"/>
    </marker>
  </defs>

  <!-- fundo próprio: legível em documento claro ou escuro -->
  <rect width="1600" height="880" fill="#0D0D0D"/>

  <!-- ===== título ===== -->
  <text x="48" y="56" font-size="13" font-weight="600" letter-spacing="4.5" fill="rgba(240,235,225,0.70)">ITXPRO</text>
  <text x="48" y="106" font-family="Khand, 'Arial Narrow', sans-serif" font-size="46" font-weight="700" fill="#F0EBE1">PIPELINE <tspan fill="#F26101">SDD</tspan></text>
  <text x="48" y="136" font-size="14" fill="rgba(240,235,225,0.70)">3 fases em mesa redonda &#183; 8 agentes ativos e 1 engatilhado &#183; 2 port&#245;es humanos fixos e 1 por exce&#231;&#227;o</text>

  <!-- ===== fase 1: intenção ===== -->
  <rect x="48" y="168" width="380" height="488" rx="4" fill="#141414" stroke="#2B2B2B" stroke-width="1"/>
  <text x="72" y="250" font-family="Khand, 'Arial Narrow', sans-serif" font-size="80" font-weight="700" fill="rgba(240,235,225,0.55)">1</text>
  <text x="132" y="204" font-size="11" font-weight="600" letter-spacing="3.8" fill="rgba(240,235,225,0.70)">FASE 1</text>
  <text x="132" y="240" font-family="Khand, 'Arial Narrow', sans-serif" font-size="26" font-weight="700" fill="#F0EBE1">INTEN&#199;&#195;O</text>

  <text x="238" y="292" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="3.8" fill="rgba(240,235,225,0.70)">MESA REDONDA</text>
  <rect x="88" y="308" width="300" height="32" rx="4" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="238" y="329" text-anchor="middle" font-size="13" fill="#F0EBE1">spec-writer</text>
  <rect x="88" y="348" width="300" height="32" rx="4" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="238" y="369" text-anchor="middle" font-size="13" fill="#F0EBE1">security-privacy-architect</text>
  <rect x="88" y="388" width="300" height="32" rx="4" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="238" y="409" text-anchor="middle" font-size="13" fill="#F0EBE1">ux-architect</text>

  <text x="238" y="470" text-anchor="middle" font-size="12" fill="rgba(240,235,225,0.55)">privacy e security by design</text>
  <text x="238" y="494" text-anchor="middle" font-size="12" fill="rgba(240,235,225,0.55)">experi&#234;ncia de primeira classe</text>
  <text x="238" y="518" text-anchor="middle" font-size="12" fill="rgba(240,235,225,0.55)">AI-first nos contratos</text>

  <line x1="72" y1="584" x2="404" y2="584" stroke="#2B2B2B" stroke-width="1"/>
  <text x="238" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#F0EBE1">Sa&#237;da: spec</text>
  <text x="238" y="632" text-anchor="middle" font-size="12" fill="rgba(240,235,225,0.70)">risco, experi&#234;ncia e postura AI-first</text>

  <!-- portão 1: humano fixo -->
  <line x1="428" y1="400" x2="452" y2="400" stroke="rgba(240,235,225,0.55)" stroke-width="1.5" marker-end="url(#seta)"/>
  <polygon points="485,372 513,400 485,428 457,400" fill="#F26101"/>
  <line x1="513" y1="400" x2="537" y2="400" stroke="rgba(240,235,225,0.55)" stroke-width="1.5" marker-end="url(#seta)"/>
  <text x="485" y="452" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#F0EBE1">PORT&#195;O HUMANO</text>
  <text x="485" y="468" text-anchor="middle" font-size="10" fill="rgba(240,235,225,0.70)">FIXO</text>

  <!-- ===== fase 2: desenho ===== -->
  <rect x="543" y="168" width="380" height="488" rx="4" fill="#141414" stroke="#2B2B2B" stroke-width="1"/>
  <text x="567" y="250" font-family="Khand, 'Arial Narrow', sans-serif" font-size="80" font-weight="700" fill="rgba(240,235,225,0.55)">2</text>
  <text x="627" y="204" font-size="11" font-weight="600" letter-spacing="3.8" fill="rgba(240,235,225,0.70)">FASE 2</text>
  <text x="627" y="240" font-family="Khand, 'Arial Narrow', sans-serif" font-size="26" font-weight="700" fill="#F0EBE1">DESENHO</text>

  <text x="733" y="292" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="3.8" fill="rgba(240,235,225,0.70)">MESA REDONDA</text>
  <rect x="583" y="308" width="300" height="32" rx="4" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="733" y="329" text-anchor="middle" font-size="13" fill="#F0EBE1">architect</text>
  <rect x="583" y="348" width="300" height="32" rx="4" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="733" y="369" text-anchor="middle" font-size="13" fill="#F0EBE1">security-privacy-architect</text>
  <rect x="583" y="388" width="300" height="32" rx="4" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="733" y="409" text-anchor="middle" font-size="13" fill="#F0EBE1">ux-architect</text>
  <rect x="583" y="428" width="300" height="32" rx="4" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="733" y="449" text-anchor="middle" font-size="13" fill="#F0EBE1">devsecops</text>

  <text x="733" y="506" text-anchor="middle" font-size="12" fill="rgba(240,235,225,0.55)">o desenho passa sozinho sem bloqueio;</text>
  <text x="733" y="530" text-anchor="middle" font-size="12" fill="rgba(240,235,225,0.55)">sobe ao humano com diverg&#234;ncia ou veto</text>

  <line x1="567" y1="584" x2="899" y2="584" stroke="#2B2B2B" stroke-width="1"/>
  <text x="733" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#F0EBE1">Sa&#237;da: plano e tarefas</text>
  <text x="733" y="632" text-anchor="middle" font-size="12" fill="rgba(240,235,225,0.70)">seguran&#231;a, intera&#231;&#227;o, deploy e budget juntos</text>

