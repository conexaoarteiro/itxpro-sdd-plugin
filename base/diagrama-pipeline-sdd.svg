  <line x1="1418" y1="400" x2="1430" y2="400" stroke="rgba(240,235,225,0.55)" stroke-width="1.5" marker-end="url(#seta)"/>
  <polygon points="1464,372 1492,400 1464,428 1436,400" fill="#F26101"/>
  <line x1="1492" y1="400" x2="1505" y2="400" stroke="rgba(240,235,225,0.55)" stroke-width="1.5" marker-end="url(#seta)"/>
  <circle cx="1528" cy="400" r="16" fill="#0CA30C"/>
  <path d="M1520,400 L1525,406 L1537,393" fill="none" stroke="#0D0D0D" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="1464" y="452" text-anchor="middle" font-size="10" font-weight="700" letter-spacing="1" fill="#F0EBE1">PORT&#195;O HUMANO</text>
  <text x="1464" y="468" text-anchor="middle" font-size="10" fill="rgba(240,235,225,0.70)">FIXO</text>

