  <rect x="1038" y="168" width="380" height="488" rx="4" fill="#141414" stroke="#2B2B2B" stroke-width="1"/>
  <text x="1062" y="250" font-family="Khand, 'Arial Narrow', sans-serif" font-size="80" font-weight="700" fill="rgba(240,235,225,0.55)">3</text>
  <text x="1122" y="204" font-size="11" font-weight="600" letter-spacing="3.8" fill="rgba(240,235,225,0.70)">FASE 3</text>
  <text x="1122" y="240" font-family="Khand, 'Arial Narrow', sans-serif" font-size="26" font-weight="700" fill="#F0EBE1">CONSTRU&#199;&#195;O E VEREDITO</text>

  <text x="1228" y="292" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="3.8" fill="rgba(240,235,225,0.70)">CONSTRU&#199;&#195;O</text>
  <rect x="1078" y="308" width="300" height="32" rx="4" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="1228" y="329" text-anchor="middle" font-size="13" fill="#F0EBE1">implementer &#183; uma tarefa por vez</text>

  <line x1="1062" y1="362" x2="1394" y2="362" stroke="#2B2B2B" stroke-width="1"/>

  <text x="1228" y="390" text-anchor="middle" font-size="11" font-weight="600" letter-spacing="3.8" fill="rgba(240,235,225,0.70)">MESA DE VEREDITO</text>
  <rect x="1078" y="404" width="300" height="32" rx="4" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="1228" y="425" text-anchor="middle" font-size="13" fill="#F0EBE1">reviewer</text>
  <rect x="1078" y="444" width="300" height="32" rx="4" fill="#1C1C1C" stroke="#E05252" stroke-width="1.5"/>
  <text x="1228" y="465" text-anchor="middle" font-size="13" font-weight="600" fill="#E05252">grc-reviewer (veto)</text>
  <rect x="1078" y="484" width="300" height="32" rx="4" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="1228" y="505" text-anchor="middle" font-size="13" fill="#F0EBE1">ux-architect</text>
  <rect x="1078" y="524" width="300" height="32" rx="4" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="1228" y="545" text-anchor="middle" font-size="13" fill="#F0EBE1">devsecops</text>
  <text x="1228" y="574" text-anchor="middle" font-size="11" fill="rgba(240,235,225,0.55)">+ security-privacy-architect conforme o risco</text>

  <line x1="1062" y1="584" x2="1394" y2="584" stroke="#2B2B2B" stroke-width="1"/>
  <text x="1228" y="610" text-anchor="middle" font-size="14" font-weight="600" fill="#F0EBE1">Sa&#237;da: veredito &#250;nico</text>
  <text x="1228" y="632" text-anchor="middle" font-size="12" fill="rgba(240,235,225,0.70)">a obje&#231;&#227;o dura fica de p&#233; no artefato</text>

