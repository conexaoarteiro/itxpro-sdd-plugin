  <polygon points="500,826 508,833 500,840 492,833" fill="#F26101"/>
  <text x="518" y="838" font-size="12" fill="rgba(240,235,225,0.70)">port&#227;o humano fixo</text>

  <polygon points="680,826 688,833 680,840 672,833" fill="none" stroke="#F26101" stroke-width="1.5"/>
  <text x="698" y="838" font-size="12" fill="rgba(240,235,225,0.70)">port&#227;o humano por exce&#231;&#227;o</text>

  <circle cx="895" cy="833" r="7" fill="#0CA30C"/>
  <text x="912" y="838" font-size="12" fill="rgba(240,235,225,0.70)">fatia no ar</text>

  <text x="1552" y="838" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="rgba(240,235,225,0.55)">itxpro-sdd v0.2.1</text>
</svg>
