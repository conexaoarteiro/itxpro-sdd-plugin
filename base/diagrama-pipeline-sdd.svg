  <rect x="288" y="695" width="71" height="26" rx="2" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="323" y="712" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#F0EBE1">01-spec</text>
  <line x1="364" y1="708" x2="378" y2="708" stroke="rgba(240,235,225,0.55)" stroke-width="1.5" marker-end="url(#seta)"/>

  <rect x="383" y="695" width="166" height="26" rx="2" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="466" y="712" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#F0EBE1">02-registro-intencao</text>
  <line x1="554" y1="708" x2="568" y2="708" stroke="rgba(240,235,225,0.55)" stroke-width="1.5" marker-end="url(#seta)"/>

  <rect x="573" y="695" width="78" height="26" rx="2" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="612" y="712" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#F0EBE1">03-plan</text>
  <line x1="656" y1="708" x2="670" y2="708" stroke="rgba(240,235,225,0.55)" stroke-width="1.5" marker-end="url(#seta)"/>

  <rect x="675" y="695" width="93" height="26" rx="2" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="721" y="712" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#F0EBE1">04-tasks</text>
  <line x1="773" y1="708" x2="787" y2="708" stroke="rgba(240,235,225,0.55)" stroke-width="1.5" marker-end="url(#seta)"/>

  <rect x="792" y="695" width="159" height="26" rx="2" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="871" y="712" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#F0EBE1">05-registro-desenho</text>
  <line x1="956" y1="708" x2="970" y2="708" stroke="rgba(240,235,225,0.55)" stroke-width="1.5" marker-end="url(#seta)"/>

  <rect x="975" y="695" width="166" height="26" rx="2" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="1058" y="712" text-anchor="middle" font-family="'JetBrains Mono', ui-monospace, Menlo, monospace" font-size="12" fill="#F0EBE1">06-registro-veredito</text>

  <text x="1528" y="712" text-anchor="end" font-size="12" fill="rgba(240,235,225,0.70)">o ls da pasta conta a hist&#243;ria</text>

  <!-- ===== engatilhado ===== -->
  <rect x="48" y="752" width="1504" height="48" rx="4" fill="none" stroke="rgba(240,235,225,0.35)" stroke-width="1" stroke-dasharray="8,5"/>
  <text x="72" y="781" font-size="11" font-weight="600" letter-spacing="3" fill="rgba(240,235,225,0.70)">ENGATILHADO</text>
  <rect x="260" y="763" width="290" height="26" rx="4" fill="none" stroke="rgba(240,235,225,0.55)" stroke-width="1" stroke-dasharray="4,3"/>
  <text x="405" y="780" text-anchor="middle" font-size="13" fill="rgba(240,235,225,0.70)">agent-experience-architect (AX)</text>
  <text x="580" y="780" font-size="12" fill="rgba(240,235,225,0.55)">presente no pacote, n&#227;o convocado; entra quando a primeira fatia expuser MCP</text>

  <!-- ===== legenda + rodapé ===== -->
  <rect x="72" y="826" width="14" height="14" rx="2" fill="#1C1C1C" stroke="rgba(240,235,225,0.15)" stroke-width="1"/>
  <text x="96" y="838" font-size="12" fill="rgba(240,235,225,0.70)">agente da mesa</text>

  <rect x="230" y="826" width="14" height="14" rx="2" fill="#1C1C1C" stroke="#E05252" stroke-width="1.5"/>
  <text x="254" y="838" font-size="12" fill="rgba(240,235,225,0.70)">veto</text>

  <rect x="330" y="826" width="14" height="14" rx="2" fill="none" stroke="rgba(240,235,225,0.55)" stroke-width="1" stroke-dasharray="3,2"/>
